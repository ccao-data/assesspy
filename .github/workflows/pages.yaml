on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

name: pages

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-sphinx-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            _build/.jupyter_cache
            _build/jupyter_execute
          key: pages-${{ runner.os }}-${{ hashFiles('docs/source/notebooks/**') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Setup Python
        shell: bash
        run: uv venv

      - name: Install Python dependencies
        run: uv pip install .[docs]

      - name: Generate HTML
        run: |
          uv run sphinx-build -j auto \
            -d _build/doctrees docs/source _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _build/html

  deploy:
    if: contains(fromJSON('["main", "master"]'), github.ref_name) && github.event_name != 'pull_request'
    needs: build-sphinx-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
